[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatmodel"
version = "0.1.0"
description = "Four-question threat modeling helper for AI and agentic systems"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]
all = ["anthropic>=0.40", "pytest>=8"]

[project.scripts]
tm = "threatmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatmodel = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
